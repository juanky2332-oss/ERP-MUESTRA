<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" font-family="Arial, Helvetica, sans-serif">
  <rect width="1600" height="1100" fill="#fff"/>
  <rect x="20" y="20" width="1560" height="1060" fill="none" stroke="#000" stroke-width="3"/>
  <defs><marker id="f" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#000"/></marker></defs>
  <text x="60" y="80" font-size="30" font-weight="bold">MESA DE TRABAJO INOXIDABLE CON ESTANTE · VISTA FRONTAL Y LATERAL</text>
  <!-- ALZADO -->
  <g fill="none" stroke="#000" stroke-width="2.5">
    <rect x="120" y="200" width="750" height="20"/>
    <rect x="120" y="220" width="6" height="20"/><rect x="864" y="220" width="6" height="20"/>
    <rect x="140" y="220" width="20" height="430"/><rect x="830" y="220" width="20" height="430"/>
    <rect x="160" y="530" width="670" height="12"/>
    <rect x="160" y="240" width="670" height="10"/>
  </g>
  <g stroke="#000" stroke-width="1.5" font-size="22">
    <line x1="120" y1="160" x2="870" y2="160" marker-start="url(#f)" marker-end="url(#f)"/><text x="460" y="150" stroke="none">1500</text>
    <line x1="920" y1="200" x2="920" y2="650" marker-start="url(#f)" marker-end="url(#f)"/><text x="930" y="430" stroke="none">900</text>
    <line x1="80" y1="530" x2="80" y2="650" marker-start="url(#f)" marker-end="url(#f)"/><text x="30" y="600" stroke="none">200</text>
    <line x1="120" y1="680" x2="870" y2="680" stroke-dasharray="6 6"/><text x="300" y="715" stroke="none">Faldón perimetral 40 mm en los 4 lados del tablero</text>
  </g>
  <!-- PERFIL -->
  <g fill="none" stroke="#000" stroke-width="2.5">
    <rect x="1080" y="200" width="350" height="20"/>
    <rect x="1100" y="220" width="20" height="430"/><rect x="1390" y="220" width="20" height="430"/>
    <rect x="1120" y="530" width="270" height="12"/>
  </g>
  <g stroke="#000" stroke-width="1.5" font-size="22">
    <line x1="1080" y1="160" x2="1430" y2="160" marker-start="url(#f)" marker-end="url(#f)"/><text x="1230" y="150" stroke="none">700</text>
  </g>
  <!-- NOTAS -->
  <g font-size="21">
    <text x="60" y="790" font-weight="bold">NOTAS</text>
    <text x="60" y="825">1. Material: acero inoxidable AISI 304. Acabado satinado grano 240 en caras vistas.</text>
    <text x="60" y="857">2. Tablero: chapa e = 1,5 mm con faldón de 40 mm plegado en los cuatro lados.</text>
    <text x="60" y="889">3. Patas: tubo cuadrado 40 × 40 × 1,5 mm (4 uds). Travesaños superiores: tubo 40 × 20 × 1,5 mm.</text>
    <text x="60" y="921">4. Estante inferior: chapa e = 1,2 mm 1400 × 600 mm con faldón de 30 mm, a 200 mm del suelo.</text>
    <text x="60" y="953">5. Unión por soldadura TIG, cordones repasados. Contera regulable en cada pata.</text>
    <text x="60" y="985" font-weight="bold">CANTIDAD: 6 UNIDADES</text>
  </g>
  <!-- CAJETIN -->
  <g font-size="18">
    <rect x="1080" y="780" width="480" height="280" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="1080" y1="840" x2="1560" y2="840" stroke="#000"/><line x1="1080" y1="900" x2="1560" y2="900" stroke="#000"/><line x1="1080" y1="960" x2="1560" y2="960" stroke="#000"/>
    <text x="1095" y="820">Cliente: HOSTELERÍA EJEMPLO S.L. (ficticio)</text>
    <text x="1095" y="880">Plano nº DEMO-001 · Rev. A</text>
    <text x="1095" y="940">Escala 1:10 · Cotas en mm</text>
    <text x="1095" y="1000">Ejemplo de demostración</text>
    <text x="1095" y="1035">Datos inventados</text>
